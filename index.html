<!DOCTYPE html>
<html lang="en">
  <head>
      <meta charset="UTF-8">
      <link rel="icon" href="/favicon.ico">
      <!-- Site and ReplyIA fonts -->
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600;700&family=Manrope:wght@400;500;600;700&family=Ubuntu:wght@300;400;500;700&display=swap" rel="stylesheet">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <meta name="theme-color" content="#1b1d21">
      <script>
          try {
              var saved = localStorage.getItem('theme');
              var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
              if (light && !/^\/(ti-seguo|replyia)(\/|$)/.test(location.pathname)) {
                  document.documentElement.classList.add('light');
              }
          } catch (e) {}
      </script>
      <style>
          html, body, #root {
              min-height: 100%;
              margin: 0;
              background: #1b1d21;
              color: #f1f5f9;
          }
          html.light, html.light body, html.light #root {
              background: #ffffff;
              color: #1f2937;
          }
      </style>
      <title>Simone Cotardo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script async src="https://scripts.simpleanalyticscdn.com/latest.js"></script>
  </body>
</html>
